<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pulse</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div id="stage">
  <div id="pose">
    <div id="card">
      <div class="shadow"></div>
      <div class="glass"><div class="wall"></div><div class="tint"></div><div class="grain"></div></div>
      <div class="shine"></div>
      <div class="rim"></div>
      <div id="content"></div>
      <div id="capsule"></div>
      <div class="wctl caption" data-nodrag><button class="cb min" data-wc="min">&#xE921;</button><button class="cb close" data-wc="close">&#xE8BB;</button></div>
      <div class="snap-edge l"></div><div class="snap-edge r"></div><div class="snap-edge t"></div><div class="snap-edge b"></div>
      <div class="rz" data-edge="l"></div><div class="rz" data-edge="r"></div><div class="rz" data-edge="t"></div><div class="rz" data-edge="b"></div>
      <div class="rz c" data-edge="tl"></div><div class="rz c" data-edge="tr"></div><div class="rz c" data-edge="bl"></div><div class="rz c" data-edge="br"></div>
      <div class="grip" data-edge="br" title=""><svg viewBox="0 0 26 26"><path d="M20 12a8 8 0 0 1-8 8"/><path d="M20.5 17.5a3 3 0 0 1-3 3"/></svg></div>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="viz.js"></script>
<script src="widget.js"></script>
</body>
</html>
