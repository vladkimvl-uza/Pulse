<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Pulse</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="widget.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div id="stage">
  <div id="win">
    <div class="shadow"></div>
    <div class="glass"><div class="wall"></div><div class="tint"></div><div class="grain"></div></div>
    <div class="rim"></div>
    <aside id="side">
      <div class="brand" data-drag><img src="icon.png" alt=""><div><b>Pulse</b><span id="ver"></span></div></div>
      <nav id="nav"><div class="hl"></div></nav>
      <div class="live" id="live"></div>
    </aside>
    <main id="main">
      <header class="bar" data-drag><h1 id="title"></h1></header>
      <div class="caption wincap" data-nodrag><button class="cb min" title="">&#xE921;</button><button class="cb close" title="">&#xE8BB;</button></div>
      <div id="pane"></div>
    </main>
    <div id="pop"></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="viz.js"></script>
<script src="settings.js"></script>
</body>
</html>
